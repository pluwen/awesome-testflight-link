name: Delete A TestFlight Link

on:
  workflow_dispatch:
    inputs:
      testflight_link:
        description: 'TestFlight 公共测试的完整链接或链接 ID'
        required: true

jobs:
  main:
    runs-on: ubuntu-latest
    if: github.repository == 'pluwen/awesome-testflight-link'
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: python3 -m pip install httpx
      - name: Delete TestFlight Link
        env:
          TF_LINK: ${{ github.event.inputs.testflight_link }}
        run: python3 scripts/del_link.py "$TF_LINK"

      - name: Commit and push changes
        env:
          TF_LINK: ${{ github.event.inputs.testflight_link }}
        run: |
          if [ -n "$(git status --porcelain README.md data/links.json)" ]; then
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"
            git add README.md data/links.json
            git commit -m "Delete TestFlight link: ${TF_LINK}"
            git push
          else
            echo "No changes to commit"
          fi
